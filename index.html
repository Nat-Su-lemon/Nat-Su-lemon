<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathaniel Su — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;
    --panel:#161B22;
    --panel-hi:#1C232D;
    --line:#2A323D;
    --text:#E6EDF3;
    --muted:#9BA7B4;
    --dim:#6B7684;
    --green:#3FB950;
    --amber:#D9A64A;
    --cyan:#58A6FF;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- Hero ---------- */
  .hero{
    max-width:var(--maxw);
    margin:0 auto;
    padding:96px 32px 56px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .trace{
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:1px;
    background:linear-gradient(90deg, var(--green), transparent 60%);
    opacity:.6;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    color:var(--green);
    letter-spacing:.02em;
    margin-bottom:20px;
  }
  .eyebrow .blink{
    display:inline-block;
    width:8px;height:15px;
    background:var(--green);
    margin-left:4px;
    vertical-align:-2px;
    animation:blink 1.2s steps(2) infinite;
  }
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(2.6rem,7vw,4.4rem);
    line-height:1.02;
    letter-spacing:-.02em;
    margin-bottom:4px;
  }
  .lede{
    font-size:clamp(1.05rem,2.2vw,1.3rem);
    color:var(--muted);
    max-width:60ch;
  }
  .lede strong{color:var(--text);font-weight:600}
  .links{
    margin-top:32px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace;
    font-size:.85rem;
  }
  .links a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    background:var(--panel);
    transition:border-color .15s, background .15s;
  }
  .links a:hover{border-color:var(--green);background:var(--panel-hi);text-decoration:none}

  /* ---------- Section head ---------- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
  .sec-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:56px 0 8px;
    flex-wrap:wrap;
    gap:8px;
  }
  .sec-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .sec-head .count{
    font-family:'JetBrains Mono',monospace;
    font-size:.8rem;
    color:var(--dim);
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    padding-bottom:24px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    cursor:pointer;
    transition:border-color .18s, transform .18s;
  }
  .card:hover{border-color:#3a4552;transform:translateY(-2px)}
  .card.wide{grid-column:1 / -1}

  .shot{
    background:#0A0D11;
    border-bottom:1px solid var(--line);
    aspect-ratio:16/9;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .card.wide .shot{aspect-ratio:21/7}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot.contain img{object-fit:contain;padding:14px}

  .body{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--amber);
    margin-bottom:10px;
  }
  .card h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.28rem;
    font-weight:600;
    line-height:1.2;
    margin-bottom:10px;
    letter-spacing:-.01em;
  }
  .card p{color:var(--muted);font-size:.95rem;margin-bottom:18px}
  .tags{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-bottom:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
  }
  .tag{
    padding:3px 9px;
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--dim);
    background:var(--bg);
  }
  .card .foot{
    margin-top:auto;
    display:flex;
    gap:16px;
    align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:.82rem;
  }
  .repo-link{
    display:inline-flex;align-items:center;gap:7px;
    color:var(--text);
  }
  .repo-link:hover{color:var(--green);text-decoration:none}
  .repo-link svg{width:15px;height:15px;fill:currentColor}
  /* Stretch the repo link across the whole card */
  .repo-link::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
  }
  /* Keep secondary links clickable above the overlay */
  .aux-link{
    color:var(--dim);
    position:relative;
    z-index:2;
  }

  /* ---------- Footer ---------- */
  footer{
    max-width:var(--maxw);
    margin:0 auto;
    padding:48px 32px 72px;
    border-top:1px solid var(--line);
    margin-top:48px;
    font-family:'JetBrains Mono',monospace;
    font-size:.8rem;
    color:var(--dim);
    display:flex;
    justify-content:space-between;
